[package]
name = "zakuro-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gles = ["dep:glow", "dep:glutin_egl_sys", "dep:libloading"]
# the Vulkan 1.1 renderer, which draws through ash and shares the mesa's
# fragment program with the OpenGL ES renderer. the panel the screens are
# shown on stays OpenGL ES, so it builds the GL renderer too.
vulkan = ["gles", "dep:ash", "dep:naga"]

[dependencies]
zakuro-common.workspace = true
log.workspace = true
bitflags.workspace = true
thiserror.workspace = true
rayon.workspace = true
wide = "1.7"
libc = "0.2"
rustc-hash = "1.1"
# texture packs, their PNGs, pack.json and the hash Citra names pictures by,
# as Zakuro reads them
png = "0.18.1"
serde_json = "1"
cityhasher = "0.1"

glow = { version = "0.16", optional = true }
glutin_egl_sys = { version = "0.7", optional = true }
libloading = { version = "0.8", optional = true }
# the Vulkan 1.1 renderer's driver interface, loaded at run time so a build
# with it still starts on a handheld with no Vulkan driver, and naga, which
# turns the GLSL the renderer builds into the SPIR-V Vulkan wants
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded", "std"] }
naga = { version = "30.0.1", optional = true, features = ["glsl-in", "wgsl-in", "spv-out"] }


[dev-dependencies]
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "spv-out"] }
