# the 32-bit build of the Android app's library, a workflow of its own so
# it finishes and its artifact is ready without waiting for CI's tests or
# the 64-bit build; run it alone from the Actions tab when only it matters
name: CI 32-bit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add armv7-linux-androideabi
      - name: build pocket-native-android for armv7-linux-androideabi
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$bin/armv7a-linux-androideabi29-clang"
          export CC_armv7_linux_androideabi="$bin/armv7a-linux-androideabi29-clang"
          export AR_armv7_linux_androideabi="$bin/llvm-ar"
          cargo build --release --locked --target armv7-linux-androideabi -p pocket-native-android
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-native-android-armv7
          path: target/armv7-linux-androideabi/release/*.so
