# builds and tests the whole workspace, the GPU tests skip themselves on a
# runner without OpenGL ES. the Android app is built 32-bit only, in a
# workflow of its own, ci-32bit.yml, so it can be run and its artifact picked
# up without waiting for these tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/lint-syscalls.sh
      - run: cargo build --release --locked
      # both GPU backends compiled and their tests run, the Vulkan one here
      # and never in the app's own build
      - run: cargo test --release --locked --workspace --features zakuro-gpu/gles,zakuro-gpu/vulkan
