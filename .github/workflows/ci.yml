# builds and tests the whole workspace, the GPU tests skip themselves on a
# runner without OpenGL ES
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked --workspace --features zakuro-gpu/gles

  # cross-builds the Android app's library with the runner's NDK, so the
  # Android port keeps building
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-linux-android
      - name: build pocket-native-android for aarch64-linux-android
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android30-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android30-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android -p pocket-native-android

android-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add armv7-linux-androideabi
      - name: build pocket-native-android for armv7-linux-androideabi
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$bin/armv7a-linux-androideabi29-clang"
          export CC_armv7_linux_androideabi="$bin/armv7a-linux-androideabi29-clang"
          export AR_armv7_linux_androideabi="$bin/llvm-ar"
          cargo build --release --locked --target armv7-linux-androideabi -p pocket-native-android
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-native-android-armv7
          path: target/armv7-linux-androideabi/release/*.so